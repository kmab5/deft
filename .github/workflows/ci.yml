name: build
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure signing
        env:
          DEFT_KEYSTORE_BASE64: ${{ secrets.DEFT_KEYSTORE_BASE64 }}
          DEFT_KEYSTORE_PASSWORD: ${{ secrets.DEFT_KEYSTORE_PASSWORD }}
          DEFT_KEY_ALIAS: ${{ secrets.DEFT_KEY_ALIAS }}
          DEFT_KEY_PASSWORD: ${{ secrets.DEFT_KEY_PASSWORD }}
        run: python3 scripts/ci-signing.py
      - name: Verify and assemble
        run: ./gradlew check assembleDebug assembleRelease
      - name: Verify release packaging
        run: python3 scripts/verify-release.py --allow-ci
